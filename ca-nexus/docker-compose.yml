services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # Pinned 2026-09-28: PG 16.15, verified `postgres --version` runs on this host.
    # (postgres:16.3-alpine entrypoint fails exec here; floating 16-alpine resolved + verified.)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mkh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkh_password}
      POSTGRES_DB: ${POSTGRES_DB:-mkh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mkh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1  # matched with qdrant-client==1.10.1 (query_points)
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:  # qdrant image has no wget/curl — bash /dev/tcp probe instead
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mkh}:${POSTGRES_PASSWORD:-mkh_password}@postgres:5432/${POSTGRES_DB:-mkh}
      QDRANT_URL: http://qdrant:6333
      QDRANT_PUBLIC_URL: http://localhost:${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: manufacturing_knowledge
      JWT_SECRET: ${JWT_SECRET:-REPLACE-ME}
      JWT_EXPIRE_HOURS: "24"
      SOURCE_ROOT: /app/supporting_data
      FILE_STORAGE_ROOT: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PRIMARY: gpt-4o
      LLM_FALLBACK: anthropic/claude-sonnet-4.5
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMPLOYEE_ID: ${BOOTSTRAP_ADMIN_EMPLOYEE_ID:-ADM-0001}
    volumes:
      - ./backend/app:/app/app
      - ../supporting_data:/app/supporting_data:ro
      - filedata:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:  # DEL-I2: frontend readiness (node:20-alpine has wget)
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # DEL-I2: optional prod profile (usage: docker compose --profile prod up --build)
  # keeps local demo default untouched; prod adds no extra services in slice-1.

volumes:
  pgdata:
  qdrant_storage:
  filedata:
